DOCKER_PLATFORM:
- linux/amd64
c_stdlib:
- sysroot
c_stdlib_version:
- '2.17'
channel_sources:
- conda-forge
channel_targets:
- conda-forge main
cuda_compiler:
- cuda-nvcc
cuda_compiler_version:
- None
cxx_compiler:
- gxx
cxx_compiler_version:
- '15'
docker_image:
- quay.io/condaforge/linux-anvil-x86_64:alma10
fortran_compiler:
- gfortran
fortran_compiler_version:
- '15'
icu:
- '79'
libblas:
- 3.9.* *netlib
libcblas:
- 3.9.* *netlib
liblapack:
- 3.9.* *netlib
liblapacke:
- 3.9.* *netlib
target_platform:
- linux-ppc64le
zip_keys:
- - cxx_compiler_version
  - fortran_compiler_version
  - c_stdlib_version
  - cuda_compiler_version
zlib:
- '1'
